<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Laesk Note</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <button class="header-btn hidden" id="back-btn">
            <i class="fas fa-chevron-left"></i> <span id="back-btn-text">폴더</span>
        </button>
        <button class="header-btn" id="options-btn">
            <i class="fas fa-ellipsis-circle"></i>
        </button>
        <button class="header-btn hidden" id="done-btn">완료</button>
    </header>

    <!-- 폴더 뷰 -->
    <main class="folders-container" id="folders-view">
        <div class="list-header">
            <h1>폴더</h1>
        </div>
        <ul class="note-list" id="folder-list">
            <!-- JS에서 동적으로 폴더 목록이 렌더링됩니다 -->
        </ul>
    </main>

    <!-- 메모 목록 뷰 -->
    <main class="note-list-container hidden" id="note-list-view">
        <div class="list-header">
            <h1 id="list-title">메모</h1>
        </div>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="검색">
        </div>
        <ul class="note-list" id="note-list">
            <!-- JS에서 메모 목록이 렌더링됩니다 -->
        </ul>
    </main>

    <!-- 메모 에디터 뷰 -->
    <main class="note-editor-container hidden" id="note-editor-view">
        <textarea id="note-textarea" placeholder="내용을 입력하세요..."></textarea>
        
        <!-- 일반 메모 툴바 -->
        <div class="editor-toolbar" id="normal-toolbar">
            <button><i class="fas fa-table"></i></button>
            <button><i class="fas fa-font"></i></button>
            <button><i class="fas fa-list-ul"></i></button>
            <button><i class="fas fa-pen"></i></button>
            <button id="delete-note-btn" style="color: #ff3b30;"><i class="fas fa-trash"></i></button>
        </div>
        
        <!-- 휴지통 툴바 -->
        <div class="editor-toolbar hidden" id="trash-toolbar">
            <button id="restore-note-btn" style="color: var(--ios-yellow); font-size: 16px; font-weight: 600;">복구</button>
            <button id="perm-delete-note-btn" style="color: #ff3b30; font-size: 16px; font-weight: 600;">영구 삭제</button>
        </div>
    </main>

    <footer class="app-footer" id="main-footer">
        <button class="compose-btn" id="new-folder-btn">
            <i class="fas fa-folder-plus"></i>
        </button>
        <span class="note-count" id="note-count">0개의 메모</span>
        <button class="compose-btn" id="new-note-btn">
            <i class="fas fa-edit"></i>
        </button>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
